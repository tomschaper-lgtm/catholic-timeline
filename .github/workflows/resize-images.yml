name: Resize Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab — use this once to sweep every image already in the repo

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Resize oversized images
        run: node scripts/resize-images.mjs

      - name: Commit resized images (if any changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Auto-resize oversized images"
            git push
          fi
