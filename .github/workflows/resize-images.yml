name: Resize Images

# Manual-only: trigger it with the "Resize Images" button in the app's Manage screen (or from
# the Actions tab). No longer runs automatically on push to images/ — one way to trigger it,
# not two.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Resize oversized images
        run: node scripts/resize-images.mjs

      - name: Commit resized images (if any changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d Images ]; then
            git add Images/
          fi
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Auto-resize oversized images"
            git push
          fi
