# .github/workflows/check-audio-links.yml
# MODULE DATE: 2026-10-27T21:55:00-05:00 (Tuesday) · v1 — ONE-TIME broken-audio-link scan. Read-only:
# it changes nothing in the repo. Run it by hand: Actions → "Check audio links (one-time)" → Run workflow.
# The report shows on the run's Summary page (and in full in the job log). Delete this file and
# scripts/check-audio-links.mjs when you no longer need them.
name: Check audio links (one-time)

on:
  workflow_dispatch:
    inputs:
      check_site:
        description: "Also check every audio and timing file on the live site (slower, catches deploy problems)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-audio-links.mjs
          sparse-checkout-cone-mode: false
      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_FLAG=""
          if [ "${{ inputs.check_site }}" != "true" ]; then SITE_FLAG="--no-site"; fi
          node scripts/check-audio-links.mjs --github "${{ github.repository }}@${{ github.ref_name }}" $SITE_FLAG
