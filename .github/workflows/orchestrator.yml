name: Orchestrator

# Manual trigger only for now — a "Run workflow" button under the Actions tab, and the Run
# button inside the app's Task : Automation panel (which fires this same workflow_dispatch
# with the count and service you pick beside it).
#
# Content-writing handlers (image-generate, audio-generate) commit their own output — data.json
# fields, image files, audio files — right after each task, not in one batch commit at the end.
# workLog.json itself now commits per-task too (twice per task — once on start, once on finish),
# not just once at the end — see the comment at the top of scripts/orchestrator.mjs for both. The
# "Commit updated work log" step below is the final safety net for whatever a per-task push
# inside the script missed, not the primary way workLog.json gets published anymore.
#
# GEMINI_API_KEY added for the new "arbitrate" service (scripts/services/arbitrate.mjs) — create
# it under repo Settings → Secrets → Actions before that service's first real run; it's the one
# manual step this file can't do for you.

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'How many queued tasks to process this run'
        required: false
        default: '5'
      task_type:
        description: 'Only run this service (blank = any)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Configure git identity
        run: |
          git config user.name "orchestrator-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run orchestrator
        run: node scripts/orchestrator.mjs
        env:
          MAX_TASKS_PER_RUN: ${{ github.event.inputs.max_tasks }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          IMAGEGEN_API_KEY: ${{ secrets.IMAGEGEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated work log
        run: |
          git add workLog.json
          if git diff --cached --quiet; then
            echo "No changes to workLog.json"
          else
            git commit -m "Orchestrator run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
