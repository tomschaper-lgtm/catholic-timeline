name: Orchestrator
# MODULE DATE: 2026-10-23T14:30:00-05:00 (Friday). 14:30: the ffmpeg check now does a real mp3 encode and reinstalls if it fails.
# 10:20: ffmpeg and espeak-ng are restored from GitHub's cache (awalsh128/cache-apt-pkgs-action@v1) instead of downloaded from Ubuntu
# every run, with a check that falls back to apt-get. (The 09:05 3-minute retry limit is removed.)

# Manual trigger only for now — a "Run workflow" button under the Actions tab, and the Run
# button inside the app's Task : Automation panel (which fires this same workflow_dispatch
# with the count and service you pick beside it).
#
# Content-writing handlers (image-generate, audio-generate) commit their own output — data.json
# fields, image files, audio files — right after each task, not in one batch commit at the end.
# workLog.json itself now commits per-task too (twice per task — once on start, once on finish),
# not just once at the end — see the comment at the top of scripts/orchestrator.mjs for both. The
# "Commit updated work log" step below is the final safety net for whatever a per-task push
# inside the script missed, not the primary way workLog.json gets published anymore.
#
# GEMINI_API_KEY added for the new "arbitrate" service (scripts/services/arbitrate.mjs) — create
# it under repo Settings → Secrets → Actions before that service's first real run; it's the one
# manual step this file can't do for you.

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'How many queued tasks to process this run'
        required: false
        default: '5'
      task_type:
        description: 'Only run this service (blank = any)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2026-10-23 (10:20): ffmpeg and espeak-ng come from a saved copy in GitHub's cache (like the Kokoro
      # model below), not from Ubuntu's package servers on every run — the Azure mirror got very slow
      # (20+ min). The first run after a cache reset still downloads once; that run may be slow.
      - name: Install ffmpeg and espeak-ng (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg espeak-ng
          version: 1.0

      # Safety net (2026-10-23T14:30): the cached copy must actually WORK, not just exist. A restored
      # ffmpeg can be on the PATH but missing a library, and the old "ffmpeg -version | head -1" check
      # passed anyway (the pipe hid the failure), so recordings died later at the mp3 step. Now it
      # encodes a tenth of a second of silence to mp3 exactly as the recorder does; if that fails,
      # it reinstalls ffmpeg and espeak-ng from Ubuntu (no time cap).
      - name: Check ffmpeg and espeak-ng
        timeout-minutes: 40
        shell: bash
        run: |
          works() {
            ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 0.1 \
              -ac 1 -ar 44100 -c:a libmp3lame -b:a 64k -y /tmp/ffcheck.mp3 && test -s /tmp/ffcheck.mp3 \
              && espeak-ng --version >/dev/null
          }
          if works; then
            echo "Cached ffmpeg and espeak-ng work (mp3 test passed)"
          else
            echo "Cached copy does not work; reinstalling from Ubuntu"
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --reinstall ffmpeg espeak-ng
            sudo ldconfig
            works || { echo "ffmpeg still cannot make an mp3 after reinstall"; ffmpeg -version; exit 1; }
            echo "Reinstalled; mp3 test passed"
          fi

      # Free local voice (Kokoro, Python version) — used when audio is recorded with a Voice ID that
      # starts with "kokoro:". The install steps run only for runs that can record audio (all runs, or
      # ones limited to audio-generate). The pip downloads and the voice model are cached between runs,
      # so only the first run pays the full install time.
      - name: Set up Python
        if: ${{ github.event.inputs.task_type == '' || github.event.inputs.task_type == 'audio-generate' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip and Kokoro model
        if: ${{ github.event.inputs.task_type == '' || github.event.inputs.task_type == 'audio-generate' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kokoro-py311-v1

      - name: Install Kokoro (CPU)
        if: ${{ github.event.inputs.task_type == '' || github.event.inputs.task_type == 'audio-generate' }}
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4"
          python -m spacy download en_core_web_sm

      - name: Configure git identity
        run: |
          git config user.name "orchestrator-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run orchestrator
        run: node scripts/orchestrator.mjs
        env:
          MAX_TASKS_PER_RUN: ${{ github.event.inputs.max_tasks }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          IMAGEGEN_API_KEY: ${{ secrets.IMAGEGEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KOKORO_SENTENCE_PAUSE_MS: '200'   # gap between sentences, in milliseconds; lower = tighter

      - name: Commit updated work log
        run: |
          git add workLog.json
          if git diff --cached --quiet; then
            echo "No changes to workLog.json"
          else
            git commit -m "Orchestrator run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
