name: Orchestrator

# Manual trigger only for now — a "Run workflow" button under the Actions tab, and the Run
# button inside the app's Task : Automation panel (which fires this same workflow_dispatch
# with the count and service you pick beside it).
#
# Content-writing handlers (image-generate today; audio-generate once ported) commit their own
# output — data.json fields, image files, audio files — right after each task, not in one batch
# commit at the end. See the comment at the top of scripts/orchestrator.mjs for why. workLog.json
# itself is still committed once at the end of the run, in the last step below.

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'How many queued tasks to process this run'
        required: false
        default: '5'
      task_type:
        description: 'Only run this service (blank = any)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name "orchestrator-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run orchestrator
        run: node scripts/orchestrator.mjs
        env:
          MAX_TASKS_PER_RUN: ${{ github.event.inputs.max_tasks }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          IMAGEGEN_API_KEY: ${{ secrets.IMAGEGEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated work log
        run: |
          git add workLog.json
          if git diff --cached --quiet; then
            echo "No changes to workLog.json"
          else
            git commit -m "Orchestrator run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
