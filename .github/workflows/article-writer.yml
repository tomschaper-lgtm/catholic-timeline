name: Article Writer

# Manual trigger only for now — a "Run workflow" button under the Actions tab.
# Add a `schedule:` trigger later once you trust the output.
on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Max article tasks to process this run'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write

jobs:
  write-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run article writer
        run: node scripts/work-articles.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TASKS_PER_RUN: ${{ github.event.inputs.max_tasks }}

      - name: Open pull request with results
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Automated article update'
          branch: auto/article-writer
          title: 'Automated article update (review before merging)'
          body-path: scripts/work-summary.txt
          delete-branch: true
