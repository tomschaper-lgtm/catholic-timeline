# .github/workflows/share-pages.yml — rebuilds s/<entry-id>.html share preview pages.
# Runs whenever data.json changes on main, once a day (catches data.json commits made by other
# workflows, which don't trigger this one), and on demand from the Actions tab.
name: Build share pages

on:
  push:
    branches: [main]
    paths:
      - data.json
      - scripts/build-share-pages.mjs
      - .github/workflows/share-pages.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: node scripts/build-share-pages.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- s)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- s
          git commit -m "Update share pages"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          exit 1
