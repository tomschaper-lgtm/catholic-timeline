# .github/workflows/jerome-pilot.yml
# MODULE DATE: 2026-10-09 (Friday) · v2.3 — article log (steps, minutes, tokens, cost) committed each run; DROPDOWNS for model and category; FASTER CHECKOUT (UNTESTED)
# v2.3: the model and the category are now pick lists. To add a model to the list, add a line under options: (it must also be in scripts/pricing.json, or the log shows 'cost unknown').
# v2.2: the checkout step took 3m20s on one run (Jerome's own work was 30 s). It now downloads no file contents up front and then only
#   scripts/ plus the top-level files (data.json, article-log.json), because Jerome needs nothing else. If a run fails at checkout or is not
#   faster, put back the v2.1 file (the same step with no 'with:' block).
# LIVE pilot of Jerome (scripts/services/source-finder.mjs). Manual only: it never runs by itself.
# It makes REAL web searches (Anthropic API, billed per search) and fetches REAL pages.
# NEW in v2: each run is added to article-log.json in the repo (a short numbered log of what happened, how long each step took,
#   and what it cost) and that one file is committed. Nothing else is written to the repo.
# Run it: GitHub app or github.com > repo > Actions > "Jerome pilot" > Run workflow.
#   - To test an EXISTING entry: fill in entry_id (for example st-augustine-430) and leave name blank.
#   - To test a NEW subject: fill in name and category (s c p m u e i), and year if you know it.
# Result: the one-line summary and the numbered log show at the top of the run page; the full JSON is in the "Run Jerome" step
# log and in the downloadable artifact "jerome-result".

name: Jerome pilot

on:
  workflow_dispatch:
    inputs:
      entry_id:
        description: 'Existing entry id (rewrite test), e.g. st-augustine-430. Leave blank for a new subject.'
        required: false
        default: ''
      name:
        description: 'New subject name, e.g. St. Bertha of Blangy (ignored if entry_id is filled in)'
        required: false
        default: ''
      category:
        description: 'New subject category (ignored when an entry id is filled in)'
        type: choice
        required: false
        default: 's - Saint'
        options:
          - 's - Saint'
          - 'c - Council'
          - 'p - Persecution'
          - 'm - Marian apparition'
          - 'u - Eucharistic miracle'
          - 'e - Event'
          - 'i - Topic page'
      year:
        description: 'New subject year (optional)'
        required: false
        default: ''
      model:
        description: 'Model for the search step (Haiku 5.5 cost $0.06 on Augustine, Sonnet 5.5 $0.25, Sonnet 4.6 $0.38)'
        type: choice
        required: false
        default: 'claude-haiku-5-5'
        options:
          - 'claude-haiku-5-5'
          - 'claude-sonnet-5-5'
          - 'claude-sonnet-4-6'
          - 'claude-opus-5-5'
      confirm_new:
        description: 'Treat as new even if a similar entry exists (use only after seeing possible_match)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Same group as the orchestrator, so the two can never write the log or the work log at the same moment.
concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  jerome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none            # do not download file contents until they are needed
          sparse-checkout: scripts     # cone mode: the scripts/ folder plus every top-level file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Jerome
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENTRY_ID: ${{ inputs.entry_id }}
          SUBJECT_NAME: ${{ inputs.name }}
          SUBJECT_CATEGORY: ${{ inputs.category }}
          SUBJECT_YEAR: ${{ inputs.year }}
          CONFIRM_NEW: ${{ inputs.confirm_new }}
          MODEL_ID: ${{ inputs.model }}
        run: |
          set -e
          MODEL_ARGS=()
          [ -n "$MODEL_ID" ] && MODEL_ARGS=(--model "$MODEL_ID")
          if [ -n "$ENTRY_ID" ]; then
            node scripts/services/source-finder.mjs --rewrite "$ENTRY_ID" --search --log "${MODEL_ARGS[@]}" > jerome-result.txt 2> jerome-log.txt
          else
            CAT_LETTER="${SUBJECT_CATEGORY%% *}"          # 's - Saint' -> 's'
            ARGS=(--category "$CAT_LETTER" --search --log "${MODEL_ARGS[@]}")
            [ -n "$SUBJECT_YEAR" ] && ARGS+=(--year "$SUBJECT_YEAR")
            [ "$CONFIRM_NEW" = "true" ] && ARGS+=(--confirm-new)
            node scripts/services/source-finder.mjs "$SUBJECT_NAME" "${ARGS[@]}" > jerome-result.txt 2> jerome-log.txt
          fi
          cat jerome-result.txt
          cat jerome-log.txt
          { echo '### Jerome pilot'; head -n 1 jerome-result.txt; echo; echo '```'; cat jerome-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the article log
        run: |
          [ -f article-log.json ] || { echo "no log file"; exit 0; }
          git config user.name "jerome-bot"
          git config user.email "actions@users.noreply.github.com"
          git add article-log.json
          if git diff --cached --quiet; then echo "log unchanged"; exit 0; fi
          git commit -m "Article log: Jerome pilot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 2))
          done
          echo "push failed after retries"; exit 1
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerome-result
          path: |
            jerome-result.txt
            jerome-log.txt
          if-no-files-found: ignore
